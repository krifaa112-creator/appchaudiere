<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mise à jour EGS Energies</title>
    <style>
      body {
        align-items: center;
        background: #07111f;
        color: #f8fafc;
        display: flex;
        font-family: Arial, sans-serif;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }

      main {
        max-width: 420px;
        padding: 28px;
        text-align: center;
      }

      strong {
        color: #38bdf8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mise à jour en cours</h1>
      <p>Nettoyage du cache local, puis ouverture de la dernière version.</p>
      <p><strong>Version 57</strong></p>
    </main>

    <script>
      async function resetAppCache() {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }

        if ("caches" in window) {
          const names = await caches.keys();
          await Promise.all(names.map((name) => caches.delete(name)));
        }

        window.location.replace("./?cache-reset=v57-" + Date.now());
      }

      resetAppCache().catch(() => {
        window.location.replace("./?cache-reset=v57-" + Date.now());
      });
    </script>
  </body>
</html>
